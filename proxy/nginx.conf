# Proxy del Geoportal Ambiental
#   /          → sitio estático (visor público)
#   /admin/    → administrador de geodatos
#   /api/      → API FastAPI (catálogo, datos, proyectos GeoLibre, administración)
# GeoLibre se publica en su propio origen (servicio «geolibre», puerto 8081).

# Detrás de otro proxy (Plesk, balanceador) se respetan sus cabeceras X-Forwarded-*;
# si este nginx recibe el tráfico directamente, se usan los valores propios.
map $http_x_forwarded_proto $geoportal_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}
map $http_x_forwarded_host $geoportal_host {
    default $http_x_forwarded_host;
    ''      $http_host;
}

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 600m;          # GEOPORTAL_MAX_UPLOAD_MB + margen
    client_body_timeout 600s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 2048;
    gzip_proxied any;
    gzip_types application/json application/geo+json text/css application/javascript image/svg+xml text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    root /usr/share/nginx/html;
    index index.html;

    # API
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $geoportal_proto;
        proxy_set_header X-Forwarded-Host $geoportal_host;
        # Prefijo de subdirectorio enviado por el proxy externo (p. ej. /geoportal)
        proxy_set_header X-Forwarded-Prefix $http_x_forwarded_prefix;
        proxy_read_timeout 900s;         # el procesamiento de rásteres grandes puede tardar
        proxy_send_timeout 900s;
        proxy_request_buffering off;     # cargas grandes se transmiten directo a la API
    }

    # Administrador: no indexar, sin caché
    location /admin/ {
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ /admin/index.html;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
