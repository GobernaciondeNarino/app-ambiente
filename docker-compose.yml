# Geoportal Ambiental — Gobernación de Nariño
# Uso:  cp .env.example .env  &&  docker compose up -d
services:
  api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      GEOPORTAL_DATA_DIR: /datos
      # Estudio SIG: el administrador instala aquí la compilación web oficial de GeoLibre
      GEOPORTAL_GEOLIBRE_DIR: /geolibre
    volumes:
      - geodatos:/datos
      - geolibre:/geolibre
      - ./portal/api/geolibre-version.json:/app/geolibre-version.json:ro
    networks: [interna]

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "${GEOPORTAL_IP:-0.0.0.0}:${GEOPORTAL_PUERTO:-8080}:80"
    volumes:
      - ./portal:/usr/share/nginx/html:ro
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - geolibre:/srv/geolibre:ro      # Estudio SIG, servido en /geolibre/
    networks: [interna]

  # Opcional: GeoLibre (https://github.com/opengeos/GeoLibre) en su propio origen.
  # El Estudio SIG integrado (/geolibre/) lo reemplaza; este servicio solo se levanta con
  #   docker compose --profile geolibre-separado up -d
  # y GEOLIBRE_PUBLIC_URL apuntando a su URL pública.
  geolibre:
    profiles: ["geolibre-separado"]
    image: ghcr.io/opengeos/geolibre:${GEOLIBRE_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${GEOPORTAL_IP:-0.0.0.0}:${GEOLIBRE_PUERTO:-8081}:80"
    environment:
      GEOLIBRE_APP_NAME: "Geoportal Ambiental Nariño"
      GEOLIBRE_SHARE_URL: "off"
      GEOLIBRE_GEOLENS_URL: "off"
      GEOLIBRE_DISABLE_SIDECAR: "${GEOLIBRE_DISABLE_SIDECAR:-1}"
      GEOLIBRE_DEPLOYMENT_FILE: /etc/geolibre/deployment.json
    volumes:
      - ./geolibre/deployment.json:/etc/geolibre/deployment.json:ro
    networks: [interna]

volumes:
  geodatos:
  geolibre:

networks:
  interna:
