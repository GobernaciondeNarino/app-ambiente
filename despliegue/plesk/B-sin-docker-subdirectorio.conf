# ------------------------------------------------------------------------------
# Plesk · Modo B (sin Docker) · geoportal en un SUBDIRECTORIO
#   https://www.ejemplo.gov.co/geoportal/
#
# Archivos: copie el contenido de portal/ en httpdocs/geoportal/
#           (o la ruta anidada elegida, p. ej. httpdocs/secretarias/ambiente/geoportal/).
# API:      servicio systemd en 127.0.0.1:8000 (ver despliegue/systemd/).
# Dónde:    Configuración de Apache y nginx → «Directivas adicionales de nginx».
# Reemplace /geoportal/ en las líneas marcadas «◄». Convive con otro sitio
# (p. ej. WordPress) en la raíz: «^~» evita que sus reglas capturen estas rutas.
# ------------------------------------------------------------------------------

location ^~ /geoportal/api/ {                             # ◄
    proxy_pass http://127.0.0.1:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /geoportal;      # ◄ sin barra final
    client_max_body_size 600m;
    proxy_request_buffering off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
}

location ^~ /geoportal/admin/ {                           # ◄
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;
}
