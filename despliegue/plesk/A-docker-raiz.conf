# ------------------------------------------------------------------------------
# Plesk · Modo A (Docker) · geoportal en la RAÍZ de un dominio o subdominio
#   https://geoportal-ambiental.ejemplo.gov.co/
#
# 1. Sitios web y dominios → <dominio> → Docker Proxy Rules → Añadir regla:
#       URL: /      Contenedor: <proyecto>-web-1      Puerto: 80
#    (Plesk genera el «location /»; no se puede declarar otro en las directivas.)
# 2. En el .env del proyecto fije la URL pública, porque la regla de Plesk no
#    reenvía el esquema https al contenedor:
#       GEOPORTAL_PUBLIC_URL=https://geoportal-ambiental.ejemplo.gov.co
# 3. En «Directivas adicionales de nginx» pegue esto (límites de carga):
# ------------------------------------------------------------------------------

client_max_body_size 600m;
proxy_request_buffering off;
proxy_read_timeout 900s;
proxy_send_timeout 900s;
