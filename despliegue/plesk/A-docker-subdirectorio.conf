# ------------------------------------------------------------------------------
# Plesk · Modo A (Docker) · geoportal en un SUBDIRECTORIO
#   https://www.ejemplo.gov.co/geoportal/
#
# Dónde: Sitios web y dominios → <dominio> → Configuración de Apache y nginx
#        → «Directivas adicionales de nginx».
# Reemplace /geoportal/ por el subdirectorio elegido (en las 3 líneas marcadas «◄»).
# Puede ser anidado, p. ej. /secretarias/ambiente/geoportal/.
# 127.0.0.1:8080 es el puerto del servicio «web» de docker compose (GEOPORTAL_PUERTO).
# ------------------------------------------------------------------------------

location = /geoportal {                                   # ◄
    return 301 /geoportal/;                               # ◄
}

location ^~ /geoportal/ {                                 # ◄
    proxy_pass http://127.0.0.1:8080/;   # la barra final quita el prefijo
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /geoportal;      # ◄ sin barra final
    client_max_body_size 600m;
    proxy_request_buffering off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
}
